<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>冬日小窝 · Winter Nook</title>
<link rel="stylesheet" href="style.css">
<script defer src="art.js"></script>
<script defer src="music.js"></script>
<script defer src="game.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M3.34 7l17.32 10M3.34 17 20.66 7M9 4l3 3 3-3M9 20l3-3 3 3M3.6 10.5l4.1-1.1-1.1-4.1M20.4 13.5l-4.1 1.1 1.1 4.1M3.6 13.5l4.1 1.1-1.1 4.1M20.4 10.5l-4.1-1.1 1.1-4.1"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M10 17V6l10-2v11M10 9l10-2"/><ellipse cx="7" cy="17.5" rx="3" ry="2.5"/><ellipse cx="17" cy="15.5" rx="3" ry="2.5"/></symbol>
  <symbol id="i-mini" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="12" y="11" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 15l6-6m-5 0h5v5"/></symbol>
  <symbol id="i-cookie" viewBox="0 0 24 24"><path d="M20.9 11.6a9 9 0 1 1-8.5-8.5 4 4 0 0 0 4.5 4.5 4 4 0 0 0 4 4zM8 9h.01M7 15h.01M12 12h.01M13 17h.01" stroke-linecap="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.9a4.8 4.8 0 0 0-6.8 0L12 8l-2-2.1a4.8 4.8 0 0 0-6.8 6.8L12 21l8.8-8.3a4.8 4.8 0 0 0 0-6.8Z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.9 13.4A8.8 8.8 0 0 1 10.6 3.1 9 9 0 1 0 20.9 13.4Z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12m0-12H8a2 2 0 1 1 2-2l2 2Zm0 0h4a2 2 0 1 0-2-2l-2 2Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M6 6l12 12M6 18 18 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>

<main class="shell">
  <section class="scene" aria-label="松果村的圣诞雪景">
    <canvas id="landscape" width="384" height="152" aria-label="像素画：雪地里有小鹿、木屋和圣诞装饰"></canvas>
    <button id="pet-hit" aria-label="摸摸小栗"></button>
    <button id="settings-star" type="button" aria-label="打开设置" aria-expanded="false" aria-controls="settings-panel">
      <svg class="star-mark" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="#8e461e" d="M7 0h2v2h1v3h6v3h-2v2h-2v2h1v4h-3v-2H6v2H3v-4h1v-2H2V8H0V5h6V2h1z"/>
        <path fill="#ffac29" d="M7 1h2v3h1v2h5v2h-2v2h-2v3h1v2h-2v-2H6v2H4v-2h1v-3H3V8H1V6h5V4h1z"/>
        <path fill="#ffe359" d="M7 3h2v3h1v1h4v1h-2v2h-2v2H6v-2H4V8H2V7h4V6h1z"/>
        <path fill="#fff6a9" d="M7 5h1v2h2v1H8v2H7V8H5V7h2z"/>
      </svg>
      <svg class="gear-mark" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="#8e461e" d="M6 0h4v2h2V1h3v3h-1v2h2v4h-2v2h1v3h-3v-1h-2v2H6v-2H4v1H1v-3h1v-2H0V6h2V4H1V1h3v1h2z"/>
        <path fill="#ffc643" fill-rule="evenodd" d="M6 1h4v2h2V2h2v2h-1v2h2v4h-2v2h1v2h-2v-1h-2v2H6v-2H4v1H2v-2h1v-2H1V6h2V4H2V2h2v1h2zM6 5h4v1h1v4h-1v1H6v-1H5V6h1z"/>
        <path fill="#fff4ac" d="M6 2h3v1H6zM3 5h1v3H3z"/>
      </svg>
    </button>
  </section>
  <section id="settings-panel" class="settings-panel" role="dialog" aria-labelledby="settings-title" hidden>
    <header class="settings-heading">
      <h1 id="settings-title" tabindex="-1">圣诞设置</h1>
      <div class="settings-actions">
        <button class="tool mode" id="mode" aria-pressed="false"><svg class="ico"><use id="mode-icon" href="#i-mini"/></svg><span id="mode-label">桌面挂件</span></button>
        <button id="close-settings" class="tool" type="button" aria-label="关闭设置">×</button>
      </div>
    </header>
  <section class="pet-bar" aria-label="照顾小栗">
    <div class="pet-info">
      <div class="avatar" aria-hidden="true"><canvas width="43" height="43" data-sprite="pet"></canvas></div>
      <div class="identity">
        <div class="pet-name">小栗<span class="species">圣诞小鹿</span></div>
        <div class="pet-status"><span class="status-dot"></span><span id="pet-status">想跟你一起看雪</span></div>
      </div>
    </div>
    <div class="care">
      <button class="care-btn primary" data-action="feed"><svg class="ico"><use href="#i-cookie"/></svg><span>喂饼干</span></button>
      <button class="care-btn" data-action="pet"><svg class="ico"><use href="#i-heart"/></svg><span>摸摸头</span></button>
      <button class="care-btn" data-action="sleep"><svg class="ico"><use href="#i-moon"/></svg><span>打个盹</span></button>
    </div>
  </section>
  <section class="music-box" aria-label="圣诞音乐盒">
    <div class="player-title">
      <div class="disc" aria-hidden="true"><svg class="ico"><use href="#i-note"/></svg></div>
      <div><div class="player-heading">圣诞音乐盒 <span id="music-count"></span></div><div class="now-playing"><strong id="track-title"></strong> <span id="track-meta"></span></div></div>
    </div>
    <div class="transport" aria-label="播放控制">
      <button class="player-button" data-step="-1" aria-label="上一首" title="上一首">|‹</button>
      <button class="player-button play" data-play aria-label="播放音乐"><span>▶</span></button>
      <button class="player-button" data-step="1" aria-label="下一首" title="下一首">›|</button>
    </div>
    <div class="music-settings">
      <select id="track-select" aria-label="选择曲目"></select>
      <select id="loop-mode" aria-label="播放模式"><option value="all">歌单循环</option><option value="one">单曲循环</option></select>
      <input id="volume" type="range" min="0" max="1" step=".01" aria-label="音乐音量" title="音乐音量">
      <label class="import" title="添加本机音频（本次打开有效）">＋本地歌曲<input type="file" id="import-songs" accept="audio/*,.mp3,.m4a,.wav,.flac,.aac,.ogg,.aiff" multiple aria-label="添加本地歌曲"></label>
    </div>
  </section>
  <section class="decor" aria-labelledby="decor-title">
    <div class="section-head">
      <h1 id="decor-title"><svg class="ico"><use href="#i-box"/></svg>DIY 圣诞工坊 <span>BUILD YOUR VILLAGE</span></h1>
      <div class="section-caption"><span id="decor-count"></span><div id="shelf-arrows" class="shelf-arrows" hidden><button id="shelf-prev" aria-label="向左浏览挂饰" title="向左浏览挂饰">‹</button><button id="shelf-next" aria-label="向右浏览挂饰" title="向右浏览挂饰">›</button></div></div>
    </div>
    <div class="builder-toolbar">
      <div class="builder-tabs" aria-label="装饰分类">
        <button data-group="tree" aria-pressed="true">圣诞树</button><button data-group="friend" aria-pressed="false">像素伙伴</button><button data-group="decor" aria-pressed="false">主题挂饰</button>
      </div>
      <div class="builder-controls">
        <label id="zone-label">树位 <select id="tree-zone" aria-label="圣诞树位置"><option value="1">中央</option><option value="0">左边</option><option value="2">右边</option></select></label>
        <label>主题 <select id="color-theme" aria-label="雪景主题"><option value="festive">红金工坊</option><option value="candy">糖果嘉年华</option><option value="aurora">极光冰境</option></select></label>
        <label>挂件长度 <select id="strip-size" aria-label="桌面挂件长度"><option value="standard">标准</option><option value="long">加长</option><option value="wide">铺满屏底</option></select></label>
      </div>
    </div>
    <div id="items" class="items" aria-label="装饰清单"></div>
  </section>
  <footer>
    <div class="stamps"><svg class="ico"><use href="#i-snow"/></svg><span>今日陪伴</span><span class="stamp-pips" id="stamp-pips" aria-hidden="true"><i></i><i></i><i></i></span><span id="stamp-count">0 / 3</span></div>
    <span class="saved"><svg class="ico"><use href="#i-check"/></svg>进度自动保存</span>
  </footer>
  </section>
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</main>
</body>
</html>
